<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="10月10日海淀桌游、唱歌与铜锅涮肉；18日颐和园散步。晚间回畅春新院附近。">
  <meta name="referrer" content="no-referrer">
  <title>北京一日出行 · 10月10日 / 18日</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='15' fill='%23233d35'/%3E%3Cpath d='M17 18v27h30M17 32h21V18' fill='none' stroke='%23fff' stroke-width='5'/%3E%3Ccircle cx='46' cy='18' r='6' fill='%23e77639'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="./style.css?v=display-2">
  <script type="module" src="./app.js?v=display-2"></script>
</head>
<body>
  <main>
    <header class="page-heading"><h1>北京一日出行</h1><span>2026年10月</span></header>
    <div class="date-tabs" role="group" aria-label="选择出行日期">
      <button type="button" data-day="10" aria-pressed="true">10月10日 <span>周六 · 市内聚会</span></button>
      <button type="button" data-day="18" aria-pressed="false">10月18日 <span>周日 · 湖边散步</span></button>
    </div>
    <article id="plan" aria-labelledby="plan-title">
      <div class="plan-heading"><h2 id="plan-title"></h2><p id="plan-area"></p></div>
      <div class="summary"><span id="plan-hours"></span><strong id="plan-budget"></strong></div>
      <ol id="timeline" class="timeline"></ol>
      <p id="essential" class="essential"></p>
      <details id="details">
        <summary>费用明细与地点参考</summary>
        <ul id="costs" class="costs"></ul>
        <p id="budget-note"></p>
        <p>餐饮、娱乐和交通为估算，非商家报价；不含酒水、打车。</p>
        <nav id="source-links" aria-label="地点与价格来源"></nav>
        <p class="map-note">返程地图检索名：北京大学畅春新园。</p>
      </details>
    </article>
    <footer>涮肉门店待定；转场时间为预留估算。</footer>
    <noscript><p>请启用 JavaScript 查看两天行程。</p></noscript>
  </main>
</body>
</html>
